<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Привычки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg1: #1b1646;
    --bg2: #2d1b69;
    --card: rgba(255, 255, 255, 0.08);
    --card-border: rgba(255, 255, 255, 0.12);
    --accent: #7c6cff;
    --accent2: #4f8cff;
    --text: #f2f0ff;
    --muted: #a9a3d6;
    --ok: #5eead4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { margin: 6px 0 2px; font-size: 26px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }

  .summary {
    display: flex; gap: 10px; margin-bottom: 18px;
  }
  .stat {
    flex: 1; padding: 12px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--card-border);
    text-align: center;
  }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--muted); }

  .add { display: flex; gap: 8px; margin-bottom: 18px; }
  .add input {
    flex: 1; padding: 13px 14px; border-radius: 14px; font-size: 16px;
    border: 1px solid var(--card-border); background: var(--card); color: var(--text);
    outline: none;
  }
  .add input::placeholder { color: var(--muted); }
  .add input:focus { border-color: var(--accent); }
  .add button {
    padding: 0 18px; border: 0; border-radius: 14px; font-size: 22px; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }

  .habit {
    display: flex; align-items: center; gap: 12px;
    padding: 14px; margin-bottom: 10px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--card-border);
  }
  .check {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--accent); background: transparent; color: #fff;
    font-size: 18px; line-height: 1;
  }
  .check.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 16px; font-weight: 600; word-break: break-word; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .dots { display: flex; gap: 5px; margin-top: 8px; }
  .dot { width: 14px; height: 14px; border-radius: 4px; background: rgba(255,255,255,0.12); }
  .dot.on { background: var(--ok); }
  .del { flex: none; border: 0; background: none; color: var(--muted); font-size: 18px; padding: 6px; }

  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Мои привычки</h1>
  <div class="sub" id="today"></div>

  <div class="summary">
    <div class="stat"><b id="sDone">0</b><span>сегодня сделано</span></div>
    <div class="stat"><b id="sBest">0</b><span>лучшая серия</span></div>
    <div class="stat"><b id="sWeek">0%</b><span>за 7 дней</span></div>
  </div>

  <form class="add" id="form">
    <input id="input" type="text" maxlength="60" placeholder="Новая привычка…" autocomplete="off">
    <button type="submit" aria-label="Добавить">+</button>
  </form>

  <div id="list"></div>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#1b1646'); tg.setBackgroundColor && tg.setBackgroundColor('#1b1646'); }

  const KEY = 'habits_v1';
  let habits = [];
  try { habits = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { habits = []; }

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(habits)); } catch (e) {} };
  const dayKey = (d) => d.toLocaleDateString('sv'); // YYYY-MM-DD по местному времени
  const todayKey = () => dayKey(new Date());
  const buzz = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };

  function lastDays(n) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      out.push(dayKey(d));
    }
    return out;
  }

  // текущая серия: подряд идущие дни до сегодня (если сегодня ещё не отмечено — считаем со вчера)
  function currentStreak(h) {
    let d = new Date();
    if (!h.done[dayKey(d)]) d.setDate(d.getDate() - 1);
    let n = 0;
    while (h.done[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function bestStreak(h) {
    const days = Object.keys(h.done).sort();
    let best = 0, cur = 0, prev = null;
    for (const k of days) {
      if (prev) {
        const diff = (new Date(k) - new Date(prev)) / 86400000;
        cur = diff === 1 ? cur + 1 : 1;
      } else cur = 1;
      best = Math.max(best, cur);
      prev = k;
    }
    return best;
  }

  function plural(n, a, b, c) {
    const m = n % 100, m1 = n % 10;
    if (m > 10 && m < 20) return c;
    if (m1 === 1) return a;
    if (m1 >= 2 && m1 <= 4) return b;
    return c;
  }

  function render() {
    const t = todayKey();
    const week = lastDays(7);
    document.getElementById('today').textContent =
      new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });

    const done = habits.filter(h => h.done[t]).length;
    document.getElementById('sDone').textContent = habits.length ? done + '/' + habits.length : '0';
    document.getElementById('sBest').textContent = habits.reduce((m, h) => Math.max(m, bestStreak(h)), 0);
    const possible = habits.length * 7;
    const got = habits.reduce((s, h) => s + week.filter(k => h.done[k]).length, 0);
    document.getElementById('sWeek').textContent = possible ? Math.round(got / possible * 100) + '%' : '0%';

    const list = document.getElementById('list');
    if (!habits.length) {
      list.innerHTML = '<div class="empty">Пока пусто.<br>Добавьте первую привычку выше 👆</div>';
      return;
    }
    list.innerHTML = '';
    habits.forEach(h => {
      const s = currentStreak(h);
      const el = document.createElement('div');
      el.className = 'habit';
      el.innerHTML = `
        <button class="check ${h.done[t] ? 'on' : ''}" data-act="toggle" data-id="${h.id}">${h.done[t] ? '✓' : ''}</button>
        <div class="info">
          <div class="name"></div>
          <div class="meta">Серия: ${s} ${plural(s, 'день', 'дня', 'дней')}</div>
          <div class="dots">${week.map(k => `<div class="dot ${h.done[k] ? 'on' : ''}"></div>`).join('')}</div>
        </div>
        <button class="del" data-act="del" data-id="${h.id}" aria-label="Удалить">✕</button>`;
      el.querySelector('.name').textContent = h.name; // textContent — защита от вставки HTML
      list.appendChild(el);
    });
  }

  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('input');
    const name = input.value.trim();
    if (!name) return;
    habits.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, done: {} });
    input.value = '';
    save(); render(); buzz();
  });

  document.getElementById('list').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const h = habits.find(x => x.id === btn.dataset.id);
    if (!h) return;
    if (btn.dataset.act === 'toggle') {
      const t = todayKey();
      if (h.done[t]) delete h.done[t]; else h.done[t] = true;
      save(); render(); buzz();
    } else if (btn.dataset.act === 'del') {
      const doDelete = () => { habits = habits.filter(x => x.id !== h.id); save(); render(); };
      if (tg && tg.showConfirm) tg.showConfirm('Удалить «' + h.name + '» вместе с историей?', ok => ok && doDelete());
      else if (confirm('Удалить «' + h.name + '»?')) doDelete();
    }
  });

  render();
</script>
</body>
</html>
